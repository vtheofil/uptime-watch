# Postgres for local development: docker compose up -d
# Connect with DATABASE_URL=postgres://uptime:uptime@localhost:5433/uptime?sslmode=disable
# Host port 5433, because 5432 is already taken on this machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
