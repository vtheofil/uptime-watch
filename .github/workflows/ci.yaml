name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing in this workflow may write to the repository by default.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Use exactly the Go from go.mod, also for tools started with `go run x@latest`
  # (without this, Go may pick an older toolchain for the tool, which then
  # cannot read our go1.27 code).
  GOTOOLCHAIN: local

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck (known vulnerabilities in our dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # The runner has Docker, so testcontainers starts a real Postgres here too.
      - name: go test
        run: go test -race ./...

  image:
    name: build, scan and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build (load locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uptime-watch:scan
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: scan with Trivy (fail on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: uptime-watch:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push (main only; the layers come from the cache)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha

  e2e:
    name: end-to-end on kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: uptime-watch
      - uses: azure/setup-helm@v4
      - name: build image and load it into kind
        run: |
          docker build -t uptime-watch:e2e --build-arg VERSION=${{ github.sha }} .
          kind load docker-image uptime-watch:e2e --name uptime-watch
      - name: install Postgres and the chart, then run the smoke test
        run: ./deploy/kind/e2e.sh uptime-watch:e2e
