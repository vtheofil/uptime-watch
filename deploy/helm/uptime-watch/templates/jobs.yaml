{{- if .Values.migrations.enabled }}
# Runs before every install and upgrade, so the tables are ready before the
# new pods start. Helm waits for it; a failed migration stops the release.
# Argo CD runs helm.sh/hook pre-install/pre-upgrade as a PreSync hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "uw.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-watch
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        # A pre-install hook runs before the release's other resources exist,
        # so this container reads only the Secret (created beforehand), not
        # the chart's ConfigMap.
        - name: migrate
          image: {{ include "uw.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
{{- end }}
{{- if .Values.prune.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-prune
  labels:
    {{- include "uw.labels" . | nindent 4 }}
    app.kubernetes.io/component: prune
spec:
  schedule: {{ .Values.prune.schedule | quote }}
  concurrencyPolicy: Forbid # never two prunes at once
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: uptime-watch
            app.kubernetes.io/component: prune
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: prune
              {{- include "uw.container" . | nindent 14 }}
              args: ["prune"]
{{- end }}
