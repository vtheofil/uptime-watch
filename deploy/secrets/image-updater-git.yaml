# The SSH deploy key Argo CD Image Updater pushes tag commits with: copied
# from OpenBao (secret/uptime-watch/image-updater, stored with
# `make openbao-deploy-key`) into the Secret argocd/image-updater-git.
# The key may write to this one repository only (a GitHub deploy key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-updater-git
  namespace: argocd
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: image-updater-git
    creationPolicy: Owner
    # The keys Image Updater expects. insecure "false": check GitHub's host
    # key against Argo CD's known hosts (argocd-ssh-known-hosts-cm).
    template:
      data:
        sshPrivateKey: "{{ .sshPrivateKey }}"
        insecure: "false"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: uptime-watch/image-updater
        property: ssh-private-key
