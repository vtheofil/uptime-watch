# Prometheus, Alertmanager and Grafana. Wave -1: it installs the CRDs
# (ServiceMonitor, PrometheusRule) that the uptime-watch chart needs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.2
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/deploy/monitoring/values.yaml
    # A second source that only provides files: $values above refers to it.
    - repoURL: https://github.com/vtheofil/uptime-watch.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs are too large for client-side apply.
      - ServerSideApply=true
