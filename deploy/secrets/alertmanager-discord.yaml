# The Discord webhook URL for Alertmanager: copied from OpenBao
# (secret/uptime-watch/discord, key webhook-url, stored with
# `make openbao-discord`) into the Secret monitoring/alertmanager-discord,
# which deploy/monitoring/values.yaml mounts. Refreshed every 15 minutes, so a
# new URL in OpenBao reaches Alertmanager without touching the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-discord
    creationPolicy: Owner # the Secret belongs to this ExternalSecret
  data:
    - secretKey: webhook-url
      remoteRef:
        key: uptime-watch/discord
        property: webhook-url
