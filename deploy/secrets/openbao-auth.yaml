# The identity External Secrets uses to log in to OpenBao (Kubernetes auth,
# deploy/openbao/k8s-auth.sh). It has no permissions on the cluster's
# resources. External Secrets asks Kubernetes for a short-lived token of it
# at each login (serviceAccountRef in openbao-store.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
  namespace: external-secrets
---
# OpenBao checks a login by asking the API server about the token (a
# TokenReview), authenticated with that same token. system:auth-delegator
# allows exactly that, token and access reviews, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-auth
    namespace: external-secrets
