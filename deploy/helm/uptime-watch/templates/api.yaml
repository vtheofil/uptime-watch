{{- $selector := include "uw.selector" (dict "root" . "component" "api") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "uw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
      annotations:
        # A changed ConfigMap changes this hash, which rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          {{- include "uw.container" . | nindent 10 }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          # Liveness: is the process alive? Never looks at the database.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Readiness: may I get traffic? Fails while the database is down
          # and during shutdown, so the Service skips this pod.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "uw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- $selector | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if gt (int .Values.api.replicas) 1 }}
---
# During node maintenance, keep at least one API pod running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "uw.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
{{- end }}
