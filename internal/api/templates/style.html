{{define "style"}}<style>
  :root {
    --bg: #f5f7fa; --surface: #fff; --fg: #17202b; --muted: #5a6677; --line: #dbe1e8;
    --up: #1b8f58; --up-soft: #e3f4ea; --down: #c93b3b; --down-soft: #fbe7e7; --wait-soft: #eef1f5;
    --accent: #2459c4; --on-accent: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --surface: #161d27; --fg: #e5eaf1; --muted: #95a2b3; --line: #273243;
      --up: #49c487; --up-soft: #143326; --down: #ff7d7d; --down-soft: #3a1c1f; --wait-soft: #1b2330;
      --accent: #7aa5ff; --on-accent: #0f141b;
      color-scheme: dark;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 60rem; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 1.4rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
  tr:last-child td { border-bottom: 0; }
  td.url { max-width: 22rem; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .up { background: var(--up-soft); color: var(--up); }
  .down { background: var(--down-soft); color: var(--down); }
  .wait { background: var(--wait-soft); color: var(--muted); }
  .empty { padding: 24px 16px; }
  .note { margin: 0; padding: 10px 14px; border-radius: 10px; }
  .note.ok { background: var(--up-soft); color: var(--up); }
  .note.err { background: var(--down-soft); color: var(--down); }
  form { padding: 20px; display: grid; gap: 14px; max-width: 32rem; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
  label small { font-weight: 400; color: var(--muted); }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button { justify-self: start; font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.85em; }
</style>{{end}}
