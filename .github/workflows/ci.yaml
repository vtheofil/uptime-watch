name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing in this workflow may write to the repository by default.
permissions:
  contents: read

# On a pull request, a newer push cancels the run that is still going. On
# main every push keeps its own run: the image job only looks at what its
# own push changed, so a cancelled run could skip an image that is needed.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Use exactly the Go from go.mod, also for tools started with `go run x@latest`
  # (without this, Go may pick an older toolchain for the tool, which then
  # cannot read our go1.27 code).
  GOTOOLCHAIN: local

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck (known vulnerabilities in our dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # The runner has Docker, so testcontainers starts a real Postgres here too.
      - name: go test
        run: go test -race ./...
      # The alert rules of the chart, evaluated by promtool on made-up series
      # (the runner has helm and Docker).
      - name: alert rules
        run: make test-rules

  image:
    name: build, scan and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history, to see what this push changed

      # Push an image to ghcr.io only when this push to main changed the app
      # (its code, dependencies or Dockerfile). Argo CD Image Updater deploys
      # every new image, so an image for a change to docs or deploy files
      # would restart the pods for nothing. Pull requests build and scan
      # every time, and push nothing.
      - id: changes
        name: did the app change?
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $EVENT != push ]]; then
            app=false
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            app=true # first push, or history rewritten: be safe
          elif git diff --name-only "$BEFORE" HEAD | grep -qE '^(cmd|internal)/|^go\.(mod|sum)$|^Dockerfile$'; then
            app=true
          else
            app=false
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build (load locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uptime-watch:scan
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: scan with Trivy (fail on fixable HIGH or CRITICAL)
        # Pinned to a commit, not a tag: a tag can be moved to other code,
        # a commit SHA cannot. This one is the v0.36.0 release.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-watch:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: log in to ghcr.io
        if: steps.changes.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push (main only, when the app changed; the layers come from the cache)
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha

  e2e:
    name: end-to-end on kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: uptime-watch
      - uses: azure/setup-helm@v4
      - name: build image and load it into kind
        run: |
          docker build -t uptime-watch:e2e --build-arg VERSION=${{ github.sha }} .
          kind load docker-image uptime-watch:e2e --name uptime-watch
      - name: install Postgres and the chart, then run the smoke test
        run: ./deploy/kind/e2e.sh uptime-watch:e2e
