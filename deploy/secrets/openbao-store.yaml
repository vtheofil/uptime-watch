# Where External Secrets Operator finds OpenBao, and how it logs in.
# ClusterSecretStore (not SecretStore): ExternalSecrets in any namespace can use it.
# OpenBao speaks the Vault API, so the "vault" provider works with it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      # The OpenBao container on kind's Docker network (deploy/openbao).
      server: http://uptime-watch-openbao:8200
      path: secret # the key/value store set up by setup.sh
      version: v2
      auth:
        # Kubernetes auth: no OpenBao token is stored in the cluster. At each
        # login ESO gets a short-lived token of the ServiceAccount openbao-auth
        # (openbao-auth.yaml) and OpenBao checks it with the API server
        # (role external-secrets, set up by deploy/openbao/k8s-auth.sh).
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
            # "openbao": the role accepts only tokens meant for it. The API
            # server's own audience (kind's default issuer) too, because
            # OpenBao makes its TokenReview with this same token.
            audiences:
              - openbao
              - https://kubernetes.default.svc.cluster.local
