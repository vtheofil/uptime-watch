# The app itself, from the Helm chart in this repo. Wave 1: after Postgres
# and the monitoring CRDs. The version that runs is image.tag in
# deploy/helm/uptime-watch/.argocd-source-uptime-watch.yaml, which Argo CD
# Image Updater commits when CI pushes a new image (deploy/image-updater/);
# Argo CD then rolls it out (the migrate Job runs first, as a PreSync hook).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-watch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/vtheofil/uptime-watch.git
    targetRevision: main
    path: deploy/helm/uptime-watch
    helm:
      valuesObject:
        image:
          repository: ghcr.io/vtheofil/uptime-watch
          # No tag here: it is in .argocd-source-uptime-watch.yaml (above),
          # so there is one place that says which version runs.
          pullPolicy: IfNotPresent
        # Targets as code: add, change or remove a target here, commit, push.
        # After the sync, the sync-targets Job makes the database match this
        # list. Targets added through the API (like "broken") are left alone.
        gitTargets:
          enabled: true
          targets:
            - name: self
              url: http://uptime-watch.uptime-watch.svc/healthz
              interval_seconds: 30
            # The canaries of NoInternet (below): big sites on three different
            # providers, checked often. All three down at once means our
            # network, not theirs.
            - name: github
              url: https://github.com
              interval_seconds: 15
            - name: cloudflare
              url: https://www.cloudflare.com
              interval_seconds: 15
            - name: google
              url: https://www.google.com
              interval_seconds: 15
        # http://status.localhost:8000 through Traefik (deploy/traefik).
        httpRoute:
          enabled: true
          hostnames: ["status.localhost"]
          parentRefs:
            - name: web
              namespace: traefik
        metrics:
          serviceMonitor:
            enabled: true
          prometheusRule:
            enabled: true
            noInternet:
              canaries: [github, cloudflare, google]
              insideTarget: self
          dashboard:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-watch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # If the ServiceMonitor/PrometheusRule CRDs are not there yet, do not
      # fail the dry run; the retry below applies them once they exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
