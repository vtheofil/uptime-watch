# The Gateway API CRDs (GatewayClass, Gateway, HTTPRoute, ...), straight from
# the kubernetes-sigs repository at a pinned tag. Wave -3: first of all,
# because Traefik (wave -2) and every HTTPRoute need these types.
# The version must be one Traefik supports (Traefik v3.7: Gateway API v1.6.3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.3
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRDs are too large for client-side apply.
      - ServerSideApply=true
