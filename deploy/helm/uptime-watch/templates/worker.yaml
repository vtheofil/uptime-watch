{{- $selector := include "uw.selector" (dict "root" . "component" "worker") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "uw.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          {{- include "uw.container" . | nindent 10 }}
          args: ["worker"]
          ports:
            - name: http
              containerPort: 8080
          # /healthz fails if the check loop has not turned for 3 poll
          # intervals: the loop is stuck, so a restart is the right fix.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
# The worker gets no traffic; this Service exists so Prometheus can find
# the worker pods' /metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "uw.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    {{- $selector | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
