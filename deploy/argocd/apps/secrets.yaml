# Secrets from OpenBao (deploy/secrets/): where OpenBao is, and which secrets
# to copy into which namespace. Wave 3, the last one: until OpenBao is running
# and holds the secret, the ExternalSecrets are Degraded, and being last they
# do not hold up the rest of the cluster. Alertmanager runs without the
# Discord webhook and picks it up as soon as it arrives.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/vtheofil/uptime-watch.git
    targetRevision: main
    path: deploy/secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
